[project]
name = "drone-landing"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Mathijs", email = "539396@student.fontys.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "gym-pybullet-drones",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "stable-baselines3>=2.9.2",
    "tensorboard>=2.21.0",
]

[tool.uv.sources]
gym-pybullet-drones = { git = "https://github.com/utiasDSL/gym-pybullet-drones.git", rev = "15c426c85ac8e7a5db66d8b100f48858133357f6" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
